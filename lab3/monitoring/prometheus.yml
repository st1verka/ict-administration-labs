global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["exporter-primary:9187"]
        labels:
          db_role: primary
      - targets: ["exporter-standby:9187"]
        labels:
          db_role: standby

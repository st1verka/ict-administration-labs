stages:
  - check
  - build

default:
  image: python:3.12-slim

check_syntax:
  stage: check
  tags: [dynamic]
  script:
    - python -m py_compile app.py test_app.py
    - sleep 20

unit_tests:
  stage: check
  tags: [dynamic]
  script:
    - python -m pip install --disable-pip-version-check -r requirements.txt
    - python -m unittest -v
    - sleep 20

build_publish:
  stage: build
  image: alpine:3.22
  tags: [static]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apk add --no-cache docker-cli docker-cli-buildx skopeo ca-certificates
    - cp "$CI_SERVER_TLS_CA_FILE" /usr/local/share/ca-certificates/lab5.crt
    - update-ca-certificates
  script:
    - |
      set -eu
      : "${CI_REGISTRY_IMAGE:?Container Registry must be enabled}"
      workdir="$(mktemp -d)"
      local_image="devplatform-service:ci-$CI_JOB_ID"

      docker buildx build --platform linux/arm64 --load         --provenance=false --sbom=false -t "$local_image" .
      docker image save --platform linux/arm64         -o "$workdir/image.tar" "$local_image"

      printf '%s\n' "$CI_REGISTRY_PASSWORD" |
        skopeo login --authfile "$workdir/auth.json"           --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

      for tag in "$CI_COMMIT_SHORT_SHA" latest; do
        target="$CI_REGISTRY_IMAGE:$tag"
        skopeo copy --dest-authfile "$workdir/auth.json" --format v2s2           "docker-archive:$workdir/image.tar:$local_image" "docker://$target"
        printf 'Published %s\n' "$target"
      done

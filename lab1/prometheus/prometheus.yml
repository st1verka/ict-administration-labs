global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/red-alerts.yml

scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8000
      
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
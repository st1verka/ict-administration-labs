name: ict-lab1

services:
  app:
    build: ./app
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/red-alerts.yml:/etc/prometheus/red-alerts.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.0
    command: [ "-config.file=/etc/loki/config.yml" ]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    command: [ "run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy" ]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - type: bind
        source: ${LAB_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - loki

  alertmanager:
    image: prom/alertmanager:v0.35.0
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alert-webhook/receiver.py:/etc/alert-webhook/receiver.py:ro
    depends_on:
      - alert-webhook

  alert-webhook:
    image: python:3.12-slim
    command: [ "python", "-u", "/app/receiver.py" ]
    volumes:
      - ./alert-webhook/receiver.py:/app/receiver.py:ro

volumes:
  grafana-data:
  loki-data:
  alloy-data:

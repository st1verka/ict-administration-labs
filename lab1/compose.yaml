name: ict-lab1

services:
  app:
    build: ./app
    ports:
      - "127.0.0.1:8081:8000"
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.23.0
    ports:
      - "127.0.0.1:16686:16686"

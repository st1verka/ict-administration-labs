apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

    jsonData:
      derivedFields:
        - name: Trace ID
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          url: 'http://127.0.0.1:16686/trace/$${__value.raw}'
          urlDisplayLabel: 'Открыть в Jaeger'
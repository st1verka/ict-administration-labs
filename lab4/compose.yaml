services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      cluster.name: ict-lab4
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      ES_JAVA_OPTS: "-Xms768m -Xmx768m"
    mem_limit: 2g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u \"elastic:$$ELASTIC_PASSWORD\" http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        printf '{"password":"%s"}' "$$KIBANA_PASSWORD" |
          curl -fsS -u "elastic:$$ELASTIC_PASSWORD" -H 'Content-Type: application/json' \
            -X POST http://elasticsearch:9200/_security/user/kibana_system/_password \
            --data-binary @-

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?Set KIBANA_ENCRYPTION_KEY in .env}
    mem_limit: 1536m
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/login > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  elastic-data:
